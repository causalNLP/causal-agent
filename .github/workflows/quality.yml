name: Code Quality & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-quality-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-quality-

    - name: Install quality tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install black isort flake8 mypy pylint bandit safety pre-commit
        pip install pytest pytest-cov coverage[toml]
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .[dev]

    - name: Check code formatting with Black
      run: |
        black --check --diff causal_agent/ tests/ --line-length 88
      continue-on-error: false

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff causal_agent/ tests/ --profile black
      continue-on-error: false

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 causal_agent/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 causal_agent/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
      continue-on-error: false

    - name: Type checking with mypy
      run: |
        mypy causal_agent/ --ignore-missing-imports --no-strict-optional --allow-untyped-defs
      continue-on-error: true  # Allow mypy to fail for now as it may need configuration

    - name: Lint with pylint
      run: |
        pylint causal_agent/ --disable=C0114,C0115,C0116,R0903,R0913,W0613 --max-line-length=88
      continue-on-error: true  # Allow pylint to fail for now as it may be strict

    - name: Security check with bandit
      run: |
        bandit -r causal_agent/ -f json -o bandit-report.json || true
        bandit -r causal_agent/ --severity-level medium
      continue-on-error: true

    - name: Check dependencies for security vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  coverage:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-coverage-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-coverage-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pytest pytest-cov pytest-xdist pytest-mock coverage[toml] pytest-html
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install -e .[dev]

    - name: Set up test environment
      run: |
        echo "PYTHONPATH=${{ github.workspace }}" >> $GITHUB_ENV
        echo "CAUSAL_AGENT_TEST_MODE=true" >> $GITHUB_ENV
        echo "CAUSAL_AGENT_LOG_LEVEL=WARNING" >> $GITHUB_ENV

    - name: Run tests with coverage
      run: |
        # Run coverage on all available test directories
        test_dirs=""
        [ -d "tests/unit" ] && test_dirs="$test_dirs tests/unit/"
        [ -d "tests/integration" ] && test_dirs="$test_dirs tests/integration/"
        [ -d "tests/end_to_end" ] && test_dirs="$test_dirs tests/end_to_end/"
        
        if [ -n "$test_dirs" ]; then
          pytest $test_dirs \
            --cov=causal_agent \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junit-xml=coverage-test-results.xml
        else
          echo "No test directories found for coverage report"
          exit 1
        fi

    - name: Generate coverage badge
      run: |
        coverage-badge -o coverage-badge.svg

    - name: Coverage comment
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 70

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/
          coverage-badge.svg
          coverage-test-results.xml

    - name: Check coverage threshold
      run: |
        coverage report --fail-under=80

  quality-gates:
    runs-on: ubuntu-latest
    needs: [code-quality, coverage]
    if: always()
    
    steps:
    - name: Check quality gate status
      run: |
        echo "Code Quality Status: ${{ needs.code-quality.result }}"
        echo "Coverage Status: ${{ needs.coverage.result }}"
        
        if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
          echo "❌ Code quality checks failed"
          exit 1
        fi
        
        if [[ "${{ needs.coverage.result }}" != "success" ]]; then
          echo "❌ Coverage requirements not met"
          exit 1
        fi
        
        echo "✅ All quality gates passed"

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Dependency Review
      uses: actions/dependency-review-action@v3
      with:
        fail-on-severity: moderate
        allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, GPL-3.0